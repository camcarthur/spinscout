apiVersion: v1
kind: Secret
metadata:
  name: {{ include "spinscout.apiConnectionsSecretName" . }}
  labels:
    {{- include "spinscout.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "spinscout.databaseUrl" . | quote }}
  REDIS_URL: {{ include "spinscout.redisUrl" . | quote }}
